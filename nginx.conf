# HTTP — used by Cloudflare Tunnel (and local access)
server {
    listen 80;
    server_name localhost binahealth.com bina.saridium.com;

    # Also keep HTTPS for direct local access
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # Max multipart upload size — 10 MB covers an iPhone HDR photo for the
    # /api/meds/pill-photo endpoint. Without this, nginx 413s before FastAPI.
    client_max_body_size 10m;

    # Static files (the web UI)
    root /usr/share/nginx/html;
    index index.html;

    # ── AI Assistant SSE streaming (must be before general /api/) ────────
    location /api/assistant/ {
        proxy_pass http://api:8000/api/assistant/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── AI Narrator & Analyst (long-running local/cloud inference) ─────
    location /api/narrator/ {
        proxy_pass http://api:8000/api/narrator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /api/analyst/ {
        proxy_pass http://api:8000/api/analyst/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── PHV API Layer (FastAPI) ────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── FHIR API (direct to HAPI for raw FHIR access) ─────────────────
    # Match both /fhir and /fhir/ (HAPI pagination uses /fhir?_getpages=...)
    location = /fhir {
        proxy_pass http://hapi:8080/fhir;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /fhir/ {
        proxy_pass http://hapi:8080/fhir/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── SPA shell: never cache. Static assets (logos, pill images) keep
    #    their own cache lifetimes below. Without this, iOS Safari home-screen
    #    web apps cling to a stale index.html for days; with no-store, every
    #    cold launch / pull-to-refresh / Reload-app tap fetches the latest.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── Pillbox images (NLM archive) ──────────────────────────────────
    # Static pill photos for the Meds tab pill-identification feature.
    # Long cache + immutable since these are frozen 2020 archive files.
    location /pillbox-images/ {
        alias /usr/share/pillbox-images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── User-uploaded pill photos (Meds tab "Use my own photo") ───────
    # These are mutable (overwritten when the user replaces a photo), so
    # we deliberately do NOT mark them immutable; the frontend appends a
    # ?v=<mtime> cache-bust to the URL so a replacement is fetched.
    location /user-pill-photos/ {
        alias /usr/share/pillbox-user-photos/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    # ── Epic OAuth callback ──────────────────────────────────────────
    location = /callback {
        try_files /callback.html =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
