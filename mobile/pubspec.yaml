name: bina_mobile
description: BinaHealth mobile app — Flutter prototype for portal scraping
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # The whole architecture rests on this — gives us addUserScript / onLoadStop /
  # evaluateJavascript / addJavaScriptHandler with full WKWebView API parity on
  # iOS+macOS and proper Android WebView control. Better than the default
  # webview_flutter for our use case.
  flutter_inappwebview: ^6.0.0

  # Documents directory for writing captured note JSONs.
  path_provider: ^2.1.4

  # iOS Keychain / Android EncryptedSharedPreferences wrapper. Used to
  # persist portal credentials (with user consent) so subsequent logins
  # autofill instead of requiring the user to retype every time.
  flutter_secure_storage: ^9.2.2

  # Reserved for iteration 3 (POSTing scrapes to the BinaHealth backend).
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # The CSN list lives in assets/ as a bundled asset. The file itself is
  # gitignored (it contains PHI — visit identifiers + provider names) and
  # is copied from tools/v3/out/ by scripts/sync-mobile-assets.sh before
  # `flutter run`. Iteration 3 will replace this with portal-driven
  # discovery so production app never bundles patient data.
  assets:
    - assets/
