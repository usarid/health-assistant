# Override: point the app at the v2 HAPI stack.
#
# Apply:    docker compose -f docker-compose.yml -f docker-compose.v2.yml -f docker-compose.app-v2.yml up -d --force-recreate api web
# Roll back: docker compose -f docker-compose.yml -f docker-compose.v2.yml up -d --force-recreate api web
#
# Nothing else in the system changes. v1 HAPI (port 8080) and v2 HAPI (port 8090)
# both keep running. Only the api's HAPI_BASE and the web's HAPI_FHIR_HOST env
# vars differ between the two modes. Both need to be in sync — the api proxies
# server-side calls to HAPI, while the web nginx routes the frontend's direct
# /fhir/* calls. If only one is switched, the dataset badge will say one thing
# and the UI will read another (which is the bug we hit on 2026-06-06).

services:
  api:
    environment:
      HAPI_BASE: "http://hapi-v2:8080/fhir"

  web:
    environment:
      HAPI_FHIR_HOST: hapi-v2
      # (NGINX_ENVSUBST_FILTER stays the same as the base config)
