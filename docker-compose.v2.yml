###############################################################################
# BinaHealth — v2 parallel rebuild stack
#
# Purpose: an isolated HAPI FHIR + Postgres + OpenSearch stack on alternate
# ports so we can rebuild the vault from raw scrapes via the v2 pipeline
# (tools/v2/) without touching the production stack on 8080.
#
# Usage:
#   docker compose -f docker-compose.v2.yml up -d           # start v2
#   docker compose -f docker-compose.v2.yml down            # stop v2
#   docker compose -f docker-compose.v2.yml down -v         # stop + drop v2 data
#   curl http://localhost:8090/fhir/metadata                # v2 FHIR
#
# The v1 stack on 8080 is unaffected by anything in this file.
###############################################################################

services:
  postgres-v2:
    image: postgres:16-alpine
    container_name: phv-postgres-v2
    restart: unless-stopped
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi_phv_2026
    volumes:
      - pgdata-v2:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch-v2:
    image: opensearchproject/opensearch:2.12.0
    container_name: phv-opensearch-v2
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=ignored
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - osdata-v2:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  hapi-v2:
    build:
      context: .
      dockerfile: hapi-config/Dockerfile
    container_name: phv-hapi-fhir-v2
    restart: unless-stopped
    depends_on:
      postgres-v2:
        condition: service_healthy
      opensearch-v2:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx2g"
      SPRING_CONFIG_LOCATION: "file:///app/config/application.yaml"
    volumes:
      - ./hapi-config/application.v2.yaml:/app/config/application.yaml:ro
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "java", "/app/healthcheck.java"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

volumes:
  pgdata-v2:
    name: phv-pgdata-v2
  osdata-v2:
    name: phv-osdata-v2
